<!doctype html>
<!-- Map style preview (F12). Run `npm run dev`, open http://localhost:5173/tools/map-preview.html -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spareway map preview</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0a0a0b;
        color: #f2f2f3;
        font: 15px/22px system-ui, sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 12px 16px;
      }
      button {
        height: 40px;
        padding: 0 14px;
        border-radius: 14px;
        border: 1px solid rgb(255 255 255 / 0.12);
        background: #1b1b1e;
        color: #f2f2f3;
        font-weight: 600;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        border-color: #e3f58c;
        color: #e3f58c;
      }
      #map {
        position: absolute;
        inset: 64px 0 0 0;
      }
      .legend {
        position: absolute;
        right: 12px;
        top: 76px;
        z-index: 2;
        display: grid;
        gap: 6px;
        padding: 12px;
        border-radius: 14px;
        background: rgb(20 20 22 / 0.9);
        border: 1px solid rgb(255 255 255 / 0.07);
      }
      .legend div {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .pin {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid #0a0a0b;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 13px;
        color: #121212;
      }
      .maplibregl-ctrl-attrib {
        background: rgb(10 10 11 / 0.7) !important;
        color: #a1a1a8 !important;
      }
      .maplibregl-ctrl-attrib a {
        color: #a1a1a8 !important;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Spareway map</strong>
      <button id="dark" aria-pressed="true">Dark</button>
      <button id="lite" aria-pressed="false">Dark lite (low-data)</button>
      <button id="light" aria-pressed="false">Light</button>
      <button id="light-lite" aria-pressed="false">Light lite</button>
    </header>
    <div class="legend" id="legend"></div>
    <div id="map"></div>
    <script type="module">
      import * as maplibregl from 'maplibre-gl'
      import 'maplibre-gl/dist/maplibre-gl.css'
      // MapLibre 6 loads its worker from a separate file the Vite dev pre-bundler doesn't serve
      import workerUrl from 'maplibre-gl/dist/maplibre-gl-worker.mjs?url'

      maplibregl.setWorkerUrl(workerUrl)

      // demo trip TRP-2026-0031 stops (Engineering Reference 6.1) and a few sample POIs
      const stops = [
        { name: 'Manesar warehouse', seq: 0, lngLat: [76.9366, 28.354] },
        { name: 'Jaipur (Sitapura)', seq: 1, lngLat: [75.8306, 26.7787] },
        { name: 'Ahmedabad (Narol)', seq: 2, lngLat: [72.5947, 22.9536] },
        { name: 'Mumbai (Bhiwandi)', seq: 3, lngLat: [73.0483, 19.2813] },
      ]
      const pois = [
        { icon: 'toll', lngLat: [76.43, 27.995] },
        { icon: 'toll', lngLat: [73.12, 22.05] },
        { icon: 'dhaba', lngLat: [76.286, 27.886] },
        { icon: 'dhaba', lngLat: [73.01, 21.72] },
        { icon: 'fuel', lngLat: [74.33, 26.11] },
        { icon: 'parking', lngLat: [72.98, 23.61] },
        { icon: 'checkpoint', lngLat: [73.3, 24.6] },
        { icon: 'no-entry', lngLat: [72.88, 19.1] },
      ]
      const stopColors = ['#a1a1a8', '#e3f58c', '#22d3ee', '#f5a524']
      const icons = ['truck', 'truck-selected', 'toll', 'dhaba', 'parking', 'fuel', 'checkpoint', 'no-entry']

      const legend = document.getElementById('legend')
      legend.innerHTML = icons.map((i) => `<div><img src="/map/icons/${i}.svg" alt="" />${i}</div>`).join('')

      const map = new maplibregl.Map({
        container: 'map',
        style: '/map/spareway-dark.json',
        bounds: [
          [71.5, 18.6],
          [78, 29],
        ],
        fitBoundsOptions: { padding: 40 },
        attributionControl: { compact: false },
      })
      map.addControl(new maplibregl.NavigationControl({ showCompass: false }))

      const el = (html) => {
        const d = document.createElement('div')
        d.innerHTML = html
        return d.firstElementChild
      }
      const markers = []
      function addOverlays() {
        markers.splice(0).forEach((m) => m.remove())
        if (!map.getSource('route')) {
          map.addSource('route', {
            type: 'geojson',
            data: { type: 'Feature', geometry: { type: 'LineString', coordinates: stops.map((s) => s.lngLat) }, properties: {} },
          })
          map.addSource('route-alt', {
            type: 'geojson',
            data: {
              type: 'Feature',
              geometry: { type: 'LineString', coordinates: [stops[0].lngLat, [74.6, 25.4], stops[2].lngLat, [73.4, 21.0], stops[3].lngLat] },
              properties: {},
            },
          })
          // other routes: ink-3 4 px 70 % · chosen route: accent 6 px (Design System 8)
          map.addLayer({ id: 'route-alt', type: 'line', source: 'route-alt', paint: { 'line-color': '#6b6b73', 'line-width': 4, 'line-opacity': 0.7 } })
          map.addLayer({ id: 'route', type: 'line', source: 'route', paint: { 'line-color': '#e3f58c', 'line-width': 6 }, layout: { 'line-cap': 'round', 'line-join': 'round' } })
        }
        for (const s of stops)
          markers.push(
            new maplibregl.Marker({ element: el(`<div class="pin" title="${s.name}" style="background:${stopColors[s.seq]}">${s.seq}</div>`) })
              .setLngLat(s.lngLat)
              .addTo(map),
          )
        for (const p of pois)
          markers.push(new maplibregl.Marker({ element: el(`<img src="/map/icons/${p.icon}.svg" alt="${p.icon}" />`) }).setLngLat(p.lngLat).addTo(map))
        markers.push(new maplibregl.Marker({ element: el('<img src="/map/icons/truck-selected.svg" alt="truck" />') }).setLngLat([75.2, 25.9]).addTo(map))
      }
      map.on('style.load', addOverlays)

      for (const name of ['dark', 'lite', 'light', 'light-lite']) {
        document.getElementById(name).addEventListener('click', () => {
          for (const b of document.querySelectorAll('header button')) b.setAttribute('aria-pressed', String(b.id === name))
          map.setStyle(`/map/spareway-${name}.json`)
        })
      }
    </script>
  </body>
</html>
